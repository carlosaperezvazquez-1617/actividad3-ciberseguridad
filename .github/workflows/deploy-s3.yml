

name: Desplegar a AWS S3 Existente

on:
  push:
    branches:
      - main  # Se activa al subir cambios a la rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código del repositorio en la máquina virtual de GitHub
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configura las credenciales de AWS usando los Secrets que guardaste
    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 

    # 3. Sincroniza los archivos con tu bucket existente
    - name: Sincronizar archivos con S3
      run: |
        aws s3 sync . s3://actividad3-seguro-2026 --exclude ".git/*" --exclude ".github/*"

